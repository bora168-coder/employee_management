name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: csbms
          POSTGRES_PASSWORD: csbms
          POSTGRES_DB: csbms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U csbms" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://csbms:csbms@localhost:5432/csbms_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @csbms/shared
      - run: npm run prisma:generate -w @csbms/api
      - name: Lint and format
        run: npm run lint && npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: API integration tests
        run: npm run test:e2e -w @csbms/api
      - name: Build
        run: npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: csbms
          POSTGRES_PASSWORD: csbms
          POSTGRES_DB: csbms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U csbms" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Configure
        run: |
          cp apps/api/.env.example apps/api/.env
          sed -i 's/^JWT_ACCESS_SECRET=.*/JWT_ACCESS_SECRET=ci-secret-that-is-long-enough-1234567890/' apps/api/.env
          # Throwaway CI database: its password is the service password above
          sed -i 's/csbms:CHANGE_ME@/csbms:csbms@/' apps/api/.env
          cp apps/web/.env.example apps/web/.env
      - run: npm run build
      - name: Migrate and seed
        working-directory: apps/api
        run: npx prisma migrate deploy && npx prisma db seed
      - name: Start API and web
        run: |
          (cd apps/api && node --env-file=.env dist/main.js &)
          (cd apps/web && npx next start -p 3000 &)
          npx wait-on -t 60000 http://localhost:4000/api/v1/health http://localhost:3000/login
      - name: Browser tests
        run: npm run test:e2e -w @csbms/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results

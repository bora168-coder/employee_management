# Nginx site for CSBMS. Replace csbms.example.gov.kh and the certificate paths.
# /api/*  → NestJS (port 4000)     everything else → Next.js (port 3000)

server {
    listen 80;
    server_name csbms.example.gov.kh;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name csbms.example.gov.kh;

    ssl_certificate     /etc/letsencrypt/live/csbms.example.gov.kh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/csbms.example.gov.kh/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # Photos max 2MB, attachments max 10MB (the API checks exact limits).
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s; # PDF rendering can take a few seconds
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

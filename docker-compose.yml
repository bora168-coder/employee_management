# Optional local tools: PostgreSQL 16 and MinIO (S3-compatible storage).
# The apps themselves run with npm (dev) or PM2 (production).
#   docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: csbms
      POSTGRES_PASSWORD: csbms
      POSTGRES_DB: csbms
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U csbms']
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
